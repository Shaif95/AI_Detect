<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: Georgia, serif; width: 320px; margin: 0; padding: 14px 16px; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 2px; color: #0b5394; }
  .sub { font-size: 12px; color: #666; margin: 0 0 10px; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; font-family: inherit; font-size: 13px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 8px; width: 100%; padding: 8px; font-size: 14px; font-family: inherit; background: #0b5394; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #9db8cc; cursor: default; }
  #result { margin-top: 10px; font-size: 13px; line-height: 1.5; }
  #result .headline { font-weight: bold; font-size: 14px; }
  .foot { font-size: 11.5px; color: #777; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; line-height: 1.5; }
  a { color: #0b5394; }
</style>
</head>
<body>
<h1>DeepfakeDetect</h1>
<p class="sub">Paste text, or select text on any page and right-click to check it.</p>
<textarea id="text" placeholder="Paste the text you want to check (at least a sentence or two)..."></textarea>
<button id="check">Check text</button>
<div id="result"></div>
<div class="foot">
  <span id="status">Free checks left today: ...</span><br>
  Text you check is sent to our checker for analysis and is not stored.<br>
  <a href="https://www.deepfakedetect.fyi/" target="_blank" rel="noopener">deepfakedetect.fyi</a>
</div>
<script src="popup.js"></script>
</body>
</html>
